<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2444"/>
      <stop offset="1" stop-color="#171427"/>
    </linearGradient>
    <linearGradient id="worm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5470"/>
      <stop offset="1" stop-color="#ff9a5c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- body: one and a half sound waves, rising to the head -->
  <path d="M44 182 C58 140 94 138 106 168 C118 198 156 200 168 164 L176 136"
        fill="none" stroke="url(#worm)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- head -->
  <circle cx="182" cy="108" r="32" fill="url(#worm)"/>
  <circle cx="192" cy="102" r="10" fill="#fff"/>
  <circle cx="195" cy="103" r="5" fill="#171427"/>
  <!-- headphones -->
  <path d="M146 112 A36 36 0 0 1 218 112" fill="none" stroke="#efeaff" stroke-width="8" stroke-linecap="round"/>
  <rect x="138" y="100" width="16" height="30" rx="8" fill="#efeaff"/>
  <rect x="210" y="100" width="16" height="30" rx="8" fill="#efeaff"/>
  <!-- a note drifting out -->
  <path d="M86 58 v34" stroke="#b9a8ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M86 58 q16 4 20 18" fill="none" stroke="#b9a8ff" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="77" cy="94" rx="12" ry="9" transform="rotate(-20 77 94)" fill="#b9a8ff"/>
</svg>
