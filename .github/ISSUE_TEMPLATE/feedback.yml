name: Feedback
description: Tell us how Earworm works for you, what's missing or what annoys you.
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Thanks for taking a minute. Only the first box is needed. This becomes a public GitHub issue, so leave out anything private.
  - type: textarea
    id: feedback
    attributes:
      label: What do you think?
      description: What works, what's missing, what gets in the way.
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: How do you like Earworm so far?
      options:
        - 5, love it
        - "4"
        - "3"
        - "2"
        - 1, not for me
  - type: input
    id: earworm
    attributes:
      label: Earworm version
      description: Filled in by "Earworm: Send Feedback". Edit or clear any of these.
  - type: input
    id: editor
    attributes:
      label: Editor
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: mode
    attributes:
      label: Mode
